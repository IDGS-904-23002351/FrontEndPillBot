<div class="dashboard-container">

  <main class="content-wrapper">
    <div class="roles-card">
      <h2 class="card-title">Gestión de Roles</h2>

      <div class="table-actions">
        <div class="search-box">
          <input type="text" placeholder="Buscar rol..." class="search-input" />
        </div>
        <button class="btn-add-role">
          <span class="plus-symbol">+</span> Añadir Rol
        </button>
      </div>

      <div class="table-responsive">
        <table class="roles-table">
          <thead>
            <tr>
              <th class="col-name">Nombre del Rol</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Administrador</td>
              <td class="actions-cell">
                <button class="icon-btn" title="Ver">&#128065;</button>
                <button class="icon-btn" title="Editar">&#128221;</button>
                <button class="icon-btn delete" title="Eliminar">&#128465;</button>
              </td>
            </tr>
            <tr>
              <td>Empleado</td>
              <td class="actions-cell">
                <button class="icon-btn" title="Ver">&#128065;</button>
                <button class="icon-btn" title="Editar">&#128221;</button>
                <button class="icon-btn delete" title="Eliminar">&#128465;</button>
              </td>
            </tr>
            <tr>
              <td>Cliente</td>
              <td class="actions-cell">
                <button class="icon-btn" title="Ver">&#128065;</button>
                <button class="icon-btn" title="Editar">&#128221;</button>
                <button class="icon-btn delete" title="Eliminar">&#128465;</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
