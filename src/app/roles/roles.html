<div class="dashboard-container">
  <main class="content-wrapper">
    <div class="roles-card">
      <h2 class="card-title">Gestión de Roles</h2>

      <button type="button" class="btn-add-role" (click)="mostrarFormulario = !mostrarFormulario">
        {{ mostrarFormulario ? 'Cancelar' : '+ Añadir Rol' }}
      </button>

      <div *ngIf="mostrarFormulario" class="form-container" style="margin: 20px 0; padding: 15px; border: 1px solid #ddd;">
        <input [(ngModel)]="nuevoRol.nombreRol" placeholder="Nombre del Rol" />
        <input [(ngModel)]="nuevoRol.descripcion" placeholder="Descripción" />
        <button type="button" (click)="agregarRol()">Guardar</button>
      </div>

      <div class="table-responsive">
        <table class="roles-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre del Rol</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let rol of roles">
              <td>{{ rol.idRol }}</td>
              <td>{{ rol.nombreRol }}</td>
              <td>{{ rol.descripcion }}</td>
              <td>{{ rol.activo ? 'Activo' : 'Inactivo' }}</td>
              <td class="actions-cell">
                <button type="button" class="icon-btn" title="Ver">👁️</button>
                <button type="button" class="icon-btn" title="Editar">✏️</button>
                <button type="button" class="icon-btn delete" (click)="eliminarRol(rol.idRol)">🗑️</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
