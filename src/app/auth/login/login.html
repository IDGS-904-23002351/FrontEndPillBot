<div class="login-container">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    @if (error) {
      <div class="alert alert-danger" role="alert" style="background-color: #f8d7da; color: #842029; padding: 12px; border-radius: 6px; margin-bottom: 1rem; border: 1px solid #f5c2c7; display: block;">
        {{ error }}
      </div>
    }

    @if (showSuccess) {
      <div class="alert alert-success" role="alert">
        {{ successMessage }}
      </div>
    }

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <input 
          type="email" 
          [(ngModel)]="usuario.correo" 
          name="correo" 
          placeholder="Correo electrónico" 
          required 
          [disabled]="loading"
          class="form-control"
        />
      </div>
      
      <div class="form-group">
        <input 
          type="password" 
          [(ngModel)]="usuario.contrasena" 
          name="contrasena" 
          placeholder="Contraseña" 
          required 
          [disabled]="loading"
          class="form-control"
        />
      </div>
      
      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="loading">Cargando...</span>
        <span *ngIf="!loading">Iniciar sesión</span>
      </button>
    </form>
  </div>
</div>
