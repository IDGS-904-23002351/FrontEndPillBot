<div class="login-container">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <form class="login-form" (ngSubmit)="onLogin()">
  <div class="form-group">
    <input type="email" [(ngModel)]="usuario.correo" name="correo" placeholder="Correo electrónico" required />
  </div>
  
  <div class="form-group">
    <input type="password" [(ngModel)]="usuario.contrasena" name="contrasena" placeholder="Contraseña" required />
  </div>
  
  <button type="submit" class="btn-submit">
    Iniciar sesión &rarr;
  </button>
</form>
    </div>
</div>
