<div class="sidebar">
  <div class="sidebar-header">
    <h1>{{ userRol }}</h1>
  </div>

  <hr class="separator" />

  <nav class="menu">
    <ul>
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          {{ item.label }}
        </a>
      </li>
    </ul>
  </nav>

  <hr class="separator" />

  <button (click)="logout()" class="logout-link">
    Cerrar sesión
  </button>
</div>
