<div class="medico-layout">
  <aside class="sidebar">
    <div class="sidebar-titulo">Medico Panel</div>

    <nav class="sidebar-nav">
      <a routerLink="/medico/expediente-clinico" routerLinkActive="nav-activo" class="nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Pacientes</span>
      </a>

      <a routerLink="/medico/medicamentos" routerLinkActive="nav-activo" class="nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M12 8v8"/>
          <path d="M8 12h8"/>
        </svg>
        <span>Medicamentos</span>
      </a>

      <a routerLink="/medico/recetas" routerLinkActive="nav-activo" class="nav-item">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M9 13h6"/>
          <path d="M9 17h6"/>
        </svg>
        <span>Recetas</span>
      </a>
    </nav>
  </aside>

  <div class="contenido">
    <header class="topbar">
      <div></div>
      <div class="usuario-info">
        <span class="usuario-nombre">{{ nombreUsuario }}</span>
        <button type="button" class="avatar" (click)="cerrarSesion()" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
